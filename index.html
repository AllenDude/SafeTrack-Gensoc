<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSICT OpenTech Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CCSICT OpenTech</h1>
            <p>Blind, skill-based technical event registration.</p>
        </header>

        <section class="form-section">
            <h2>Apply for an Event</h2>
            <form id="applicationForm">
                <div class="form-group">
                    <label for="student_id">Student ID Number (No Names)</label>
                    <input type="text" id="student_id" name="student_id" placeholder="e.g., 26-1711" pattern="\d{2}-\d{4}" title="Format: YY-XXXX (e.g., 26-1711)" required>
                </div>

                <div class="form-group">
                    <label for="event_name">Select Technical Event</label>
                    <select id="event_name" name="event_name" required>
                        <option value="" disabled selected>Select an event...</option>
                        <option value="Annual CCSICT Hackathon">Annual CCSICT Hackathon</option>
                        <option value="Java Coding Competition">Java Coding Competition</option>
                        <option value="Web Development Challenge">Web Development Challenge</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="target_role">Target Role</label>
                    <select id="target_role" name="target_role" required>
                        <option value="" disabled selected>Select your desired role...</option>
                        <option value="Lead Programmer">Lead Programmer</option>
                        <option value="Database Architect">Database Architect</option>
                        <option value="UI/UX Designer">UI/UX Designer</option>
                        <option value="Documentation / QA">Documentation / QA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skills">Technical Skills</label>
                    <input type="text" id="skills" name="skills" placeholder="e.g., Python, HTML/CSS, Java" required>
                </div>

                <button type="submit" id="submitBtn">Submit Application</button>
            </form>
            <div id="statusMessage" class="hidden"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
